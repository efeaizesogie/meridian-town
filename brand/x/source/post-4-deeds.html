<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  /* 1600 x 900 */
  .frame { background: var(--paper); }
  .shot { object-position: 50% 50%; }
  .deed { position: absolute; right: 72px; top: 72px; bottom: 72px; width: 700px; padding: 44px 48px; display: flex; flex-direction: column; }
  .seal { align-self: flex-start; font-size: 20px; }
  h1 { font-size: 84px; margin-top: 28px; }
  p { margin-top: 22px; font-size: 27px; line-height: 1.3; color: var(--ink-2); }
  .ledger { margin-top: auto; border-top: 2.5px dashed var(--rule); padding-top: 22px; display: grid; gap: 12px; font-size: 24px; }
  .ledger div { display: flex; justify-content: space-between; }
  .ledger span { color: var(--muted); }
  .ledger b { font-weight: 600; }
</style></head>
<body><div class="frame">
  <img class="shot" src="island-dusk.jpg" alt="">
  <div class="deed card grain">
    <span class="chip pear seal">Shop deed · NFT</span>
    <h1>Buy the shop. Keep the profit.</h1>
    <p>Every shop in Meridian is a deed you can own. Win it at auction, collect half its daily profit, and pick the AI that runs it.</p>
    <div class="ledger">
      <div><span>Paid to the deed holder</span><b>50% of daily profit</b></div>
      <div><span>When a shop goes broke</span><b>Up for auction</b></div>
      <div><span>Sell it on</span><b>Any NEAR NFT market</b></div>
    </div>
  </div>
</div></body></html>
