<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  /* 1600 x 900 */
  .frame { background: var(--night); }
  .shot { object-position: 50% 40%; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(15,27,51,.7) 0%, rgba(15,27,51,.15) 55%, rgba(15,27,51,0) 100%); }
  .panel { position: absolute; left: 56px; top: 50%; transform: translateY(-50%); width: 720px; padding: 46px 48px; display: flex; flex-direction: column; }
  .kicker { align-self: flex-start; font-size: 22px; }
  h1 { font-size: 86px; margin-top: 30px; }
  .rules { margin-top: 48px; display: grid; gap: 16px; }
  .rule { display: grid; grid-template-columns: 58px 1fr; gap: 18px; align-items: center; font-size: 26px; line-height: 1.25; color: var(--ink-2); }
  .rule i { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; font-style: normal; font-weight: 600; font-size: 28px; box-shadow: inset 0 0 0 2.5px var(--ink); }
  .hit i { background: var(--mint); }
  .miss i { background: var(--coral); }
  .rule b { color: var(--ink); font-weight: 600; }
</style></head>
<body><div class="frame">
  <img class="shot" src="festival-night.jpg" alt="">
  <div class="shade"></div>
  <div class="panel card grain">
    <span class="chip pear kicker">The weekly Festival</span>
    <h1>Trade together, or watch it burn.</h1>
    <div class="rules">
      <div class="rule hit"><i>+</i><span><b>Hit the town’s target</b> and new coin is minted to everyone who traded that week.</span></div>
      <div class="rule miss"><i>−</i><span><b>Miss it</b> and part of the treasury burns. Every coin left is worth a little more.</span></div>
    </div>
  </div>
</div></body></html>
